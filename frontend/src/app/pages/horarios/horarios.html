<app-page-bg>
<div class="hours-page">
  <section class="hours-shell">
    <app-page-header [showBack]="true" backHref="/"></app-page-header>

    <div class="hours-center">
      <header class="hours-heading">
        <span class="hours-eyebrow">Horarios</span>
        <h1>Horarios de clases</h1>
      </header>

      <div class="panel-card" aria-label="Horarios del gimnasio">
        <div class="panel-card-bar">
          <span class="panel-dot"></span>
          <span class="panel-dot"></span>
          <span class="panel-dot"></span>
          <span class="panel-card-title">Semana</span>
        </div>

        <div class="panel-card-body">
          <div class="panel-row">
            <span>Lunes a viernes — Manana</span>
            <strong>6:30 - 10:00</strong>
          </div>

          <div class="panel-row">
            <span>Lunes a viernes — Siesta</span>
            <strong>13:30 - 16:00</strong>
          </div>

          <div class="panel-row">
            <span>Lunes a viernes — Tarde / noche</span>
            <strong>18:00 - 22:00</strong>
          </div>

          <div class="panel-row">
            <span>Sabado</span>
            <strong>9:00 - 11:00</strong>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
</app-page-bg>
