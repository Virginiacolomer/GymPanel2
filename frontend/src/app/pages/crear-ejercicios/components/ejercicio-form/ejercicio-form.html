<div class="form-group">
  <label for="input-nuevo-ejercicio">
    Agregar nuevo ejercicio a
    <strong class="highlight-grupo">{{ selectedGrupoNombre() || 'este grupo' }}</strong
    >:
  </label>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form-inline">
    <input
      id="input-nuevo-ejercicio"
      type="text"
      formControlName="nombre"
      placeholder="Escribe el nombre del ejercicio (ej: Press militar...)"
      autocomplete="off"
    />
    <button
      type="submit"
      [disabled]="isCreatingEjercicio() || form.invalid || !selectedGrupoId()"
      class="btn btn-primary"
    >
      <i class="fi fi-rs-gym" aria-hidden="true"></i>
      {{ isCreatingEjercicio() ? 'Creando...' : 'Crear Ejercicio' }}
    </button>
  </form>

  <p
    *ngIf="feedbackMessage()"
    class="form-feedback"
    [ngClass]="'form-feedback-' + feedbackType()"
    aria-live="polite"
  >
    {{ feedbackMessage() }}
  </p>
</div>
