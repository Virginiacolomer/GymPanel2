<!-- Display existing exercises in selected group -->
<div *ngIf="isLoadingGrupoDetalle()" class="ejercicios-list">
  <h3>Ejercicios en este grupo:</h3>
  <p class="empty-state">Cargando ejercicios...</p>
</div>

<div *ngIf="selectedGrupoId() && !isLoadingGrupoDetalle()" class="ejercicios-list">
  <h3>Ejercicios en este grupo:</h3>
  <div *ngIf="ejercicios().length > 0; else noEjercicios">
    <ul>
      <li *ngFor="let ejercicio of ejercicios(); trackBy: trackByEjercicioId">
        <div
          class="ejercicio-row"
          *ngIf="editingEjercicioId !== ejercicio.id; else editEjercicioTpl"
        >
          <div class="ejercicio-info">
            <app-zoomable-image
              *ngIf="ejercicio.imagenUrl"
              [src]="ejercicio.imagenUrl"
              [alt]="ejercicio.nombre"
              class="ejercicio-thumb"
            ></app-zoomable-image>
            <span>{{ ejercicio.nombre }}</span>
          </div>
          <div class="ejercicio-actions">
            <button
              type="button"
              class="btn btn-secondary btn-small"
              [class.btn-image-success]="recentlyUploadedImagenEjercicioId() === ejercicio.id"
              (click)="uploadImage.emit(ejercicio)"
              [disabled]="isUploadingImagenEjercicioId() === ejercicio.id"
            >
              {{
                isUploadingImagenEjercicioId() === ejercicio.id
                  ? 'Subiendo...'
                  : recentlyUploadedImagenEjercicioId() === ejercicio.id
                    ? '✓ Imagen subida'
                    : ejercicio.imagenUrl
                      ? 'Reemplazar imagen'
                      : 'Subir imagen'
              }}
            </button>
            <button
              type="button"
              class="btn btn-secondary btn-small"
              (click)="startEdit(ejercicio)"
              [disabled]="
                (isUpdatingEjercicio() && pendingEditEjercicioId() === ejercicio.id) ||
                (isDeletingEjercicio() && pendingDeleteEjercicioId() === ejercicio.id)
              "
            >
              Editar
            </button>
            <button
              type="button"
              class="btn btn-danger btn-small"
              (click)="deleteEjercicio.emit(ejercicio)"
              [disabled]="
                (isUpdatingEjercicio() && pendingEditEjercicioId() === ejercicio.id) ||
                (isDeletingEjercicio() && pendingDeleteEjercicioId() === ejercicio.id)
              "
            >
              {{
                isDeletingEjercicio() && pendingDeleteEjercicioId() === ejercicio.id
                  ? 'Eliminando...'
                  : 'Borrar'
              }}
            </button>
          </div>
        </div>

        <ng-template #editEjercicioTpl>
          <form
            [formGroup]="editEjercicioForm"
            (ngSubmit)="submitEdit(ejercicio.id)"
            class="ejercicio-edit-row"
          >
            <input type="text" formControlName="nombre" placeholder="Nombre del ejercicio" />
            <button
              type="submit"
              class="btn btn-secondary btn-small"
              [disabled]="
                (isUpdatingEjercicio() && pendingEditEjercicioId() === ejercicio.id) ||
                editEjercicioForm.invalid
              "
            >
              {{
                isUpdatingEjercicio() && pendingEditEjercicioId() === ejercicio.id
                  ? 'Guardando...'
                  : 'Guardar'
              }}
            </button>
            <button
              type="button"
              class="btn btn-small btn-ghost"
              (click)="cancelEdit()"
              [disabled]="isUpdatingEjercicio() && pendingEditEjercicioId() === ejercicio.id"
            >
              Cancelar
            </button>
          </form>
        </ng-template>
      </li>
    </ul>
  </div>

  <ng-template #noEjercicios>
    <p *ngIf="hasLoadedGrupoDetalle()" class="empty-state">
      No hay ejercicios registrados en este grupo aún
    </p>
  </ng-template>
</div>
