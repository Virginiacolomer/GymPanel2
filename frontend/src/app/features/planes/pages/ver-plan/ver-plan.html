<app-page-bg>
  <main class="page-with-compact-header">
    <app-page-header-compact backHref="/asignar-plan"></app-page-header-compact>
    <section class="page-body">
      <div class="plan-shell">
        <h1>Plan {{ selectedUserName }}</h1>

        @if (currentPlan?.nombre) {
        <p class="plan-name-caption">Nombre del plan: {{ currentPlan?.nombre }}</p>
        }

        @if (statusMessage) {
        <p class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
        }

        @if (isLoading) {
        <p class="status-message" role="status" aria-live="polite">Cargando plan...</p>
        }
        <app-editor-semana [days]="days" [editable]="isEditing" [allowAddRemove]="isEditing"
          [exerciseOptions]="exerciseOptions" (dayToggled)="toggleDay($event)" (rowAdded)="addExerciseRow($event)"
          (rowRemoved)="removeExerciseRow($event.dayIndex, $event.rowIndex)"
          (exerciseBlur)="validateExerciseSelection($event.dayIndex, $event.rowIndex)"></app-editor-semana>

        <div class="button-group">
          @if (isEditing) {
          <button type="button" class="save-btn" (click)="savePlan()">
            <span class="icon" aria-hidden="true"></span>
            <span>Guardar cambios</span>
          </button>
          <button type="button" class="cancel-btn" (click)="cancelEditing()">
            <span>Cancelar</span>
          </button>
          } @else {
          <button type="button" class="edit-btn" [disabled]="days.length === 0 || isLoading" (click)="startEditing()">
            <span class="icon" aria-hidden="true"></span>
            <span>Editar plan</span>
          </button>
          <button type="button" class="download-btn" [disabled]="days.length === 0 || isLoading"
            (click)="downloadPdf()">
            <span class="download-icon" aria-hidden="true"></span>
            <span>Descargar PDF</span>
          </button>
          @if (dbPlans.length > 0) {
          <div class="assign-db-section">
            <label class="assign-db-label">Asignar plan existente:</label>
            <div class="assign-db-controls">
              <select [(ngModel)]="selectedDbPlanId" class="assign-db-select">
                <option [ngValue]="null">-- Seleccionar plan --</option>
                @for (plan of dbPlans; track plan.id) {
                <option [ngValue]="plan.id">{{ plan.nombre }}</option>
                }
              </select>
              <button type="button" class="assign-db-btn" (click)="assignDbPlan()"
                [disabled]="!selectedDbPlanId || isAssigning || isLoading">
                {{ isAssigning ? 'Asignando...' : 'Asignar' }}
              </button>
            </div>
          </div>
          }
          }
        </div>
      </div>
    </section>
  </main>
</app-page-bg>
