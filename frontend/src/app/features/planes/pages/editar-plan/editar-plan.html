<app-page-bg>
  <main class="page-with-compact-header">
    <app-page-header-compact backHref="/asignar-plan"></app-page-header-compact>
    <section class="page-body">
      <div class="plan-shell">
        <h1>Plan {{ selectedUserName }}</h1>

        @if (planName) {
        <p class="plan-name-caption">Nombre del plan: {{ planName }}</p>
        }

        @if (statusMessage) {
        <p class="status-message" role="status" aria-live="polite">{{ statusMessage }}</p>
        }

        @if (isLoading) {
        <p class="status-message" role="status" aria-live="polite">Cargando plan...</p>
        }

        <app-editor-semana [days]="days" [editable]="true" (dayToggled)="toggleDay($event)"></app-editor-semana>

        @if (days.length > 0) {
        <a class="confirm-btn" routerLink="/asignar-plan">Confirmar</a>
        }
      </div>
    </section>
  </main>
</app-page-bg>
